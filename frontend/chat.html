<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - 채팅</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen flex flex-col bg-gray-50">
  <header class="bg-white border-b px-4 py-3 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center gap-3">
      <span class="bg-teal-600 text-white font-bold px-3 py-1 rounded">TaskFlow</span>
      <span id="team-name" class="font-medium text-gray-700 text-sm"></span>
      <span id="poll-indicator" class="text-xs text-green-500">● 5초마다 새로고침</span>
    </div>
    <nav class="hidden md:flex gap-1">
      <a href="/kanban.html" class="text-gray-600 hover:bg-gray-100 px-4 py-1.5 rounded text-sm">칸반</a>
      <a href="/chat.html" class="bg-teal-600 text-white px-4 py-1.5 rounded text-sm font-medium">채팅</a>
      <a href="/members.html" class="text-gray-600 hover:bg-gray-100 px-4 py-1.5 rounded text-sm">멤버</a>
    </nav>
    <button onclick="logout()" class="text-sm text-gray-500 hover:text-gray-700">로그아웃</button>
  </header>

  <div id="msg-list" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

  <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center text-gray-400">
    <div class="text-5xl mb-3">💬</div>
    <p class="font-medium">아직 대화가 없습니다</p>
    <p class="text-sm mt-1">첫 메시지를 보내 팀원과 대화를 시작하세요</p>
  </div>

  <div class="bg-white border-t px-4 py-3 flex-shrink-0">
    <p id="conn-err" class="hidden text-red-500 text-xs mb-1">⚠ 연결 끊김 · 재시도 중...</p>
    <div class="flex gap-2 items-end">
      <div class="flex-1 relative">
        <textarea id="msg-input" rows="1" maxlength="1000" placeholder="메시지 입력 (1000자 이내)…"
          class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:border-teal-500 resize-none pr-16"
          oninput="onInput(this)" onkeydown="handleKey(event)"></textarea>
        <span id="char-count" class="absolute bottom-2 right-2 text-xs text-gray-300">0/1000</span>
      </div>
      <button id="send-btn" onclick="send()" disabled
        class="bg-teal-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-teal-700 disabled:opacity-40">전송</button>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    requireTeam();
    const me = getUser(); const teamId = me?.team_id;
    let msgs = [], lastTime = null, failCnt = 0, pollTimer = null;

    const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');

    async function init() {
      try { const t = await apiFetch(`/teams/${teamId}`); document.getElementById('team-name').textContent = t.name + ' 팀 · 채팅'; } catch(e) {}
      await loadMsgs(true);
      startPoll();
    }

    async function loadMsgs(init = false) {
      try {
        const url = (!init && lastTime) ? `/teams/${teamId}/messages?since=${encodeURIComponent(lastTime)}` : `/teams/${teamId}/messages`;
        const fresh = await apiFetch(url);
        failCnt = 0;
        document.getElementById('conn-err').classList.add('hidden');
        document.getElementById('poll-indicator').textContent = '● 5초마다 새로고침';
        document.getElementById('poll-indicator').className = 'text-xs text-green-500';
        if (init) msgs = fresh; else msgs = [...msgs, ...fresh];
        if (fresh.length) lastTime = fresh[fresh.length - 1].created_at;
        else if (init && msgs.length) lastTime = msgs[msgs.length - 1].created_at;
        renderMsgs(init);
      } catch(e) {
        if (e?.message === 'Unauthorized') return;
        failCnt++;
        document.getElementById('conn-err').classList.remove('hidden');
        document.getElementById('poll-indicator').textContent = `⚠ 연결 끊김 (시도 ${failCnt})`;
        document.getElementById('poll-indicator').className = 'text-xs text-red-500';
      }
    }

    function renderMsgs(scroll = false) {
      const list = document.getElementById('msg-list');
      const empty = document.getElementById('empty-state');
      if (!msgs.length) { list.classList.add('hidden'); empty.classList.remove('hidden'); return; }
      list.classList.remove('hidden'); empty.classList.add('hidden');
      list.innerHTML = '';
      msgs.forEach(m => {
        const isMe = m.user_id === me.id;
        const time = new Date(m.created_at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
        const sender = m.user_email.split('@')[0];
        const div = document.createElement('div');
        div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
        div.dataset.mid = m.id;
        if (isMe) {
          div.innerHTML = `<div class="max-w-xs md:max-w-sm">
            <div class="text-right text-xs text-gray-400 mb-0.5">나 · ${time}</div>
            <div class="relative group">
              <div class="bg-teal-600 text-white rounded-lg px-3 py-2 text-sm">${esc(m.content)}</div>
              <button onclick="delMsg(${m.id})" class="absolute -left-7 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 transition text-base">🗑</button>
            </div></div>`;
        } else {
          div.innerHTML = `<div class="max-w-xs md:max-w-sm">
            <div class="text-xs text-gray-400 mb-0.5">${esc(sender)} · ${time}</div>
            <div class="bg-white border rounded-lg px-3 py-2 text-sm shadow-sm">${esc(m.content)}</div></div>`;
        }
        list.appendChild(div);
      });
      if (scroll) list.scrollTop = list.scrollHeight;
    }

    function onInput(el) {
      const n = el.value.length;
      document.getElementById('char-count').textContent = `${n}/1000`;
      document.getElementById('char-count').className = n > 1000 ? 'absolute bottom-2 right-2 text-xs text-red-500 font-bold' : 'absolute bottom-2 right-2 text-xs text-gray-300';
      document.getElementById('send-btn').disabled = n === 0 || n > 1000;
      el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }

    async function send() {
      const inp = document.getElementById('msg-input');
      const content = inp.value.trim();
      if (!content || content.length > 1000) return;
      try {
        const m = await apiFetch(`/teams/${teamId}/messages`, { method: 'POST', body: JSON.stringify({ content }) });
        inp.value = ''; inp.style.height = 'auto';
        document.getElementById('char-count').textContent = '0/1000';
        document.getElementById('send-btn').disabled = true;
        msgs.push(m); lastTime = m.created_at; renderMsgs(true);
      } catch(e) { showError(e); }
    }

    async function delMsg(id) {
      try { await apiFetch(`/messages/${id}`, { method: 'DELETE' }); msgs = msgs.filter(m => m.id !== id); renderMsgs(false); }
      catch(e) { showError(e); }
    }

    function startPoll() {
      const poll = async () => {
        await loadMsgs(false);
        const delay = [5000,10000,20000,40000,60000][Math.min(failCnt,4)];
        pollTimer = setTimeout(poll, delay);
      };
      pollTimer = setTimeout(poll, 5000);
    }

    // Mobile keyboard viewport resize
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        document.body.style.height = window.visualViewport.height + 'px';
      });
    }

    init();
  </script>
</body>
</html>
