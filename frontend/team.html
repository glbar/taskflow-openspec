<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - 팀 선택</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50">
  <header class="bg-white border-b px-4 py-3 flex items-center justify-between">
    <span class="bg-teal-600 text-white font-bold px-3 py-1 rounded">TaskFlow</span>
    <div class="flex items-center gap-3">
      <span id="user-email" class="text-sm text-gray-500"></span>
      <button onclick="logout()" class="text-sm text-gray-500 hover:text-gray-700">로그아웃</button>
    </div>
  </header>

  <!-- Invite code success modal -->
  <div id="invite-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 w-72">
      <p class="text-green-600 font-semibold mb-2">✓ 팀이 생성되었습니다!</p>
      <p class="text-sm text-gray-500 mb-1">초대코드 (멤버에게 공유)</p>
      <div class="flex items-center gap-2 bg-gray-50 border rounded px-3 py-2 mb-4">
        <span id="invite-code-text" class="font-mono text-lg font-bold text-teal-600 tracking-widest flex-1"></span>
        <button onclick="copyCode()" class="text-xs text-gray-400 hover:text-gray-600">📋복사</button>
      </div>
      <button onclick="window.location.href='/kanban.html'"
        class="w-full bg-teal-600 text-white py-2 rounded font-medium hover:bg-teal-700">칸반 시작하기 →</button>
    </div>
  </div>

  <div class="max-w-2xl mx-auto mt-8 px-4">
    <div class="bg-blue-50 border border-blue-200 text-blue-700 text-sm px-4 py-3 rounded mb-6">
      ℹ 아직 팀에 소속되지 않았습니다. 팀을 만들거나 초대코드로 합류하세요.
    </div>
    <div class="grid md:grid-cols-2 gap-6">
      <div class="bg-white rounded-lg p-6 shadow-sm">
        <h3 class="font-semibold mb-4">+ 새 팀 만들기</h3>
        <input id="team-name" type="text" placeholder="팀 이름 (1–30자)" maxlength="30"
          class="w-full border rounded px-3 py-2 text-sm mb-2 focus:outline-none focus:border-teal-500">
        <p id="create-err" class="hidden text-red-500 text-xs mb-2"></p>
        <button onclick="createTeam()" class="w-full bg-teal-600 text-white py-2 rounded text-sm font-medium hover:bg-teal-700">만들기</button>
      </div>
      <div class="bg-white rounded-lg p-6 shadow-sm">
        <h3 class="font-semibold mb-4">초대코드로 합류</h3>
        <input id="invite-code" type="text" placeholder="ABCD-1234" maxlength="9"
          class="w-full border rounded px-3 py-2 text-sm mb-1 font-mono uppercase focus:outline-none focus:border-teal-500"
          oninput="this.value=this.value.toUpperCase()">
        <p class="text-xs text-gray-400 mb-2">형식: 대문자 4 + 숫자 4 (하이픈 포함)</p>
        <p id="join-err" class="hidden text-red-500 text-xs mb-2"></p>
        <button onclick="joinTeam()" class="w-full bg-orange-500 text-white py-2 rounded text-sm font-medium hover:bg-orange-600">합류</button>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    requireAuth();
    const u = getUser();
    if (u) { document.getElementById('user-email').textContent = u.email; if (u.team_id) window.location.href = '/kanban.html'; }

    async function createTeam() {
      const name = document.getElementById('team-name').value.trim();
      const errEl = document.getElementById('create-err');
      errEl.classList.add('hidden');
      if (!name) { errEl.textContent = '팀 이름을 입력하세요'; errEl.classList.remove('hidden'); return; }
      try {
        const data = await apiFetch('/teams', { method: 'POST', body: JSON.stringify({ name }) });
        const user = getUser(); user.team_id = data.id; setUser(user);
        document.getElementById('invite-code-text').textContent = data.invite_code;
        document.getElementById('invite-modal').classList.remove('hidden');
      } catch (err) { errEl.textContent = err?.error?.message || '팀 생성 실패'; errEl.classList.remove('hidden'); }
    }

    function copyCode() {
      navigator.clipboard.writeText(document.getElementById('invite-code-text').textContent)
        .then(() => showToast('복사됨', 'success'));
    }

    async function joinTeam() {
      const code = document.getElementById('invite-code').value.trim();
      const errEl = document.getElementById('join-err');
      errEl.classList.add('hidden');
      if (!/^[A-Z]{4}-[0-9]{4}$/.test(code)) {
        errEl.textContent = '형식이 올바르지 않습니다 (예: ABCD-1234)';
        errEl.classList.remove('hidden'); return;
      }
      try {
        const data = await apiFetch('/teams/join', { method: 'POST', body: JSON.stringify({ invite_code: code }) });
        const user = getUser(); user.team_id = data.team.id; setUser(user);
        window.location.href = data.redirect || '/kanban.html';
      } catch (err) { errEl.textContent = err?.error?.message || '합류 실패'; errEl.classList.remove('hidden'); }
    }
  </script>
</body>
</html>
